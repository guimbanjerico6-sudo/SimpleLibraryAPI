<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Members | Production UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Inter', sans-serif;
        }

        .navbar {
            margin-bottom: 30px;
        }

        .card {
            border: none;
            border-radius: 12px;
            transition: 0.3s;
        }

            .card:hover {
                box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
            }

        .badge {
            font-weight: 500;
            padding: 0.5em 0.8em;
            letter-spacing: 0.5px;
        }

        .avatar-placeholder {
            width: 40px;
            height: 40px;
            background: #e2e8f0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            margin-right: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-book-reader me-2"></i>LibraryApp</a>
            <div class="d-flex">
                <a class="btn btn-light btn-sm me-2 fw-bold" href="users.html">Members</a>
                <a class="btn btn-outline-light btn-sm" href="history.html">History</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-dark fw-bold">Library Members</h5>
                <button class="btn btn-primary shadow-sm" onclick="openUserModal()">
                    <i class="fas fa-user-plus me-2"></i>Register Member
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Member Info</th>
                                <th>Library Card No.</th>
                                <th>User ID</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
                <div id="loader" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted small">Loading members...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <form id="userForm">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">New Member Registration</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="uFullName" class="form-control bg-light" placeholder="e.g. Juan Dela Cruz" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary border-0" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4 border-0">Issue Card</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>const API_URL = 'https://localhost:7046/api/Books';

        $(document).ready(function () {
            loadUsers();

            $('#userForm').on('submit', function (e) {
                e.preventDefault();
                saveUser();
            });
        });

        function loadUsers() {
            $('#loader').show();
            $('#usersTableBody').empty();

            $.ajax({
                url: `${API_URL}/users`, // GET /api/Books/users
                type: 'GET',
                success: function (data) {
                    let rows = '';
                    if (data.length === 0) {
                        rows = `<tr><td colspan="3" class="text-center py-5 text-muted">No registered members yet.</td></tr>`;
                    } else {
                        data.forEach(u => {
                            // Extract first letter for avatar
                            const initial = u.fullName ? u.fullName.charAt(0).toUpperCase() : '?';
                            rows += `
                                <tr>
                                    <td class="ps-4">
                                        <div class="d-flex align-items-center">
                                            <div class="avatar-placeholder">${initial}</div>
                                            <div class="fw-bold text-dark">${u.fullName}</div>
                                        </div>
                                    </td>
                                    <td><span class="badge bg-secondary-subtle text-secondary font-monospace border">${u.libraryCard}</span></td>
                                    <td class="text-muted">#${u.userId}</td>
                                </tr>`;
                        });
                    }
                    $('#usersTableBody').html(rows);
                    $('#loader').hide();
                },
                error: function () {
                    $('#usersTableBody').html('<tr><td colspan="3" class="text-center py-4 text-danger">Connection Error. Is Port 7046 running?</td></tr>');
                    $('#loader').hide();
                }
            });
        }

        function openUserModal() {
            $('#userForm')[0].reset();
            $('#userModal').modal('show');
        }

        function saveUser() {
            const userData = { fullName: $('#uFullName').val() };

            $.ajax({
                url: `${API_URL}/user`, // POST /api/Books/user
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(userData),
                success: function (res) {
                    // API returns CardNumber and Message [cite: 183]
                    alert(`${res.message}\nCard Number: ${res.cardNumber}`);
                    $('#userModal').modal('hide');
                    loadUsers();
                },
                error: function (xhr) { alert('Backend Error: ' + xhr.responseText); }
            });
        }</script>
</body>
</html>
